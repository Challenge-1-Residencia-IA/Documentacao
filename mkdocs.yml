site_name: Documentação
site_description: Documentação do Challenge 1 - Residência IA
repo_url: https://github.com/Challenge-1-Residencia-IA/Documentacao
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Início: index.md
  - Visão do Projeto:
      - Visão geral: visao-geral.md
      - Público-alvo: publico-alvo.md
      - Princípios do sistema: principios.md
  - Produto:
      - Casos de uso: casos-de-uso.md
      - Requisitos: requisitos.md
      - Levantamento de requisitos: levantamento-de-requisitos.md
      - Histórias de usuário: historias-de-usuario.md
      - Fluxo e interação: fluxo-e-interacao.md
  - Sistema de IA:
      - Fontes e evidências: fontes-e-evidencias.md
      - Arquitetura: arquitetura.md
      - Pipeline de IA: pipeline-ia.md
  - Qualidade e Governança:
      - Privacidade e segurança: privacidade-e-seguranca.md
      - Métricas e avaliação: metricas-e-avaliacao.md
      - Testes: testes.md
      - Riscos: riscos.md
  - Planejamento:
      - Roadmap e cronograma: roadmap.md
  - Referências: referencias.md
  - Relatórios: 
    - Primeiro relatorio Sprint 1: relatorio-avaliacao-modelo.md