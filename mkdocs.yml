site_name: "Sophia — Verificadora de fatos"
site_description: Documentação da Sophia, assistente de WhatsApp que ajuda a verificar informações mostrando fontes e evidências, sem dar veredito (Challenge 1 - Residência IA)
repo_url: https://github.com/Challenge-1-Residencia-IA/Documentacao
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  logo: assets/logo-sophia-redonda.png
  favicon: assets/logo-sophia-redonda.png
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Alternar para modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Alternar para o tema do sistema
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Início: index.md
  - Entrega final: entrega-final.md
  - Produto final: produto-final.md
  - Visão do Projeto:
      - Visão geral: visao-geral.md
      - Guiding Questions: guiding-questions.md
      - Público-alvo: publico-alvo.md
      - Princípios do sistema: principios.md
  - Produto:
      - Casos de uso: casos-de-uso.md
      - Requisitos: requisitos.md
      - Levantamento de requisitos: levantamento-de-requisitos.md
      - Histórias de usuário: historias-de-usuario.md
      - Fluxo e interação: fluxo-e-interacao.md
  - Dados:
      - Datasets e EDA: datasets-e-eda.md
  - Sistema de IA:
      - Arquitetura: arquitetura.md
      - Fontes e evidências: fontes-e-evidencias.md
      - Pipeline de IA: pipeline-ia.md
  - Qualidade e Governança:
      - CI/CD e LLMOps: mlops-llmops.md
      - Relatório técnico da solução de IA: relatorio-tecnico-modelo.md
      - Métricas e avaliação: metricas-e-avaliacao.md
      - Privacidade e segurança: privacidade-e-seguranca.md
      - Testes: testes.md
      - Riscos: riscos.md
  - Planejamento:
      - Organização e Scrum: organizacao-scrum.md
      - Roadmap e cronograma: roadmap.md

  # deixar a aba de referências sempre por último
  - Referências: referencias.md
